<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Aurababy Profile</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --purple-deep: #1a0d2e;
  --purple-mid: #2d1b4e;
  --purple-bright: #7b2cbf;
  --blue-bright: #00b4d8;
  --pink-neon: #f72585;
  --white: #ffffff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  font-family: "Poppins", sans-serif;
  color: var(--white);
  overflow-x: hidden;
}

body {
  background: linear-gradient(125deg, #1a0d2e 0%, #2d1b4e 25%, #3e1f5c 50%, #2d1b4e 75%, #1a0d2e 100%);
  background-size: 400% 400%;
  animation: gradientFlow 20s ease infinite;
  position: relative;
}

@keyframes gradientFlow {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.3;
  pointer-events: none;
  z-index: 0;
}

.orb1 {
  width: 500px;
  height: 500px;
  background: var(--purple-bright);
  top: -250px;
  left: -250px;
  animation: float 25s ease-in-out infinite;
}

.orb2 {
  width: 400px;
  height: 400px;
  background: var(--blue-bright);
  bottom: -200px;
  right: -200px;
  animation: float 30s ease-in-out infinite reverse;
}

.orb3 {
  width: 350px;
  height: 350px;
  background: var(--pink-neon);
  top: 50%;
  left: 50%;
  animation: float 35s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(100px, -100px) scale(1.1); }
  66% { transform: translate(-100px, 100px) scale(0.9); }
}

.container {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: 30px 20px;
  min-height: 100vh;
}

.back-button {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 25px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 16px;
  color: var(--white);
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s ease;
  margin-bottom: 30px;
}

.back-button:hover {
  background: rgba(255,255,255,0.15);
  transform: translateX(-5px);
  box-shadow: 0 0 20px rgba(123,44,191,0.4);
}

.profile-header {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 32px;
  padding: 50px;
  margin-bottom: 30px;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.profile-avatar-container {
  position: relative;
  display: inline-block;
  margin-bottom: 25px;
}

.profile-avatar {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid rgba(255,255,255,0.2);
  box-shadow: 0 0 40px rgba(123,44,191,0.6);
  animation: avatarPulse 3s ease-in-out infinite;
  cursor: pointer;
}

@keyframes avatarPulse {
  0%, 100% { box-shadow: 0 0 40px rgba(123,44,191,0.6); }
  50% { box-shadow: 0 0 60px rgba(247,37,133,0.8); }
}

.edit-avatar-btn {
  position: absolute;
  bottom: 5px;
  right: 5px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--purple-bright), var(--pink-neon));
  border: none;
  color: var(--white);
  font-size: 1.2em;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(123,44,191,0.5);
  transition: all 0.3s ease;
}

.edit-avatar-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 6px 20px rgba(247,37,133,0.7);
}

.profile-username {
  font-size: 2.5em;
  font-weight: 800;
  background: linear-gradient(135deg, var(--white), var(--blue-bright), var(--pink-neon));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 15px;
}

.profile-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 25px;
  background: rgba(0,255,0,0.1);
  border: 2px solid rgba(0,255,0,0.3);
  border-radius: 20px;
  font-size: 1em;
  font-weight: 600;
}

.status-dot {
  width: 10px;
  height: 10px;
  background: #00ff00;
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
  box-shadow: 0 0 15px #00ff00;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(1.2); }
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.stat-card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 30px;
  text-align: center;
  transition: all 0.3s ease;
}

.stat-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 48px rgba(123,44,191,0.4);
  border-color: rgba(255,255,255,0.2);
}

.stat-icon {
  font-size: 3em;
  margin-bottom: 15px;
  filter: drop-shadow(0 0 20px rgba(255,255,255,0.5));
}

.stat-value {
  font-size: 2.5em;
  font-weight: 800;
  background: linear-gradient(135deg, var(--blue-bright), var(--pink-neon));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 5px;
}

.stat-label {
  font-size: 1em;
  opacity: 0.8;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.section {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 35px;
  margin-bottom: 30px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.section-title {
  font-size: 1.8em;
  font-weight: 800;
  background: linear-gradient(135deg, var(--white), var(--blue-bright));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.add-btn {
  padding: 12px 25px;
  background: linear-gradient(135deg, var(--purple-bright), var(--pink-neon));
  border: none;
  border-radius: 12px;
  color: var(--white);
  font-family: "Poppins", sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
}

.add-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(247,37,133,0.5);
}

.friends-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 15px;
}

.friend-card {
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  transition: all 0.3s ease;
  cursor: pointer;
}

.friend-card:hover {
  background: rgba(255,255,255,0.1);
  transform: translateY(-5px);
  box-shadow: 0 8px 20px rgba(123,44,191,0.3);
}

.friend-avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  margin: 0 auto 12px;
  border: 2px solid rgba(255,255,255,0.2);
}

.friend-name {
  font-weight: 700;
  font-size: 1.1em;
  margin-bottom: 5px;
}

.friend-status {
  font-size: 0.85em;
  opacity: 0.7;
}

.rooms-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.room-card {
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 20px 25px;
  display: flex;
  align-items: center;
  gap: 15px;
  transition: all 0.3s ease;
}

.room-card:hover {
  background: rgba(255,255,255,0.1);
  transform: translateX(5px);
}

.room-icon {
  font-size: 2em;
}

.room-info {
  flex: 1;
}

.room-name {
  font-weight: 700;
  font-size: 1.2em;
  margin-bottom: 5px;
}

.room-members {
  font-size: 0.9em;
  opacity: 0.7;
}

.room-privacy {
  padding: 6px 15px;
  border-radius: 20px;
  font-size: 0.85em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.room-privacy.public {
  background: rgba(0,255,0,0.1);
  border: 2px solid rgba(0,255,0,0.3);
  color: #00ff00;
}

.room-privacy.private {
  background: rgba(255,165,0,0.1);
  border: 2px solid rgba(255,165,0,0.3);
  color: #ffa500;
}

.room-privacy:hover {
  transform: scale(1.05);
}

/* Modal Styles */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(10px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: rgba(26,13,46,0.95);
  backdrop-filter: blur(20px);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 32px;
  padding: 40px;
  max-width: 700px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.modal-title {
  font-size: 2em;
  font-weight: 800;
  background: linear-gradient(135deg, var(--white), var(--pink-neon));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.close-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: none;
  color: var(--white);
  font-size: 1.5em;
  cursor: pointer;
  transition: all 0.3s ease;
}

.close-btn:hover {
  background: rgba(255,255,255,0.2);
  transform: rotate(90deg);
}

.avatar-presets {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 15px;
  margin-bottom: 25px;
}

.preset-avatar {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 12px;
  object-fit: cover;
  cursor: pointer;
  border: 3px solid transparent;
  transition: all 0.3s ease;
}

.preset-avatar:hover {
  border-color: var(--blue-bright);
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(0,180,216,0.5);
}

.preset-avatar.selected {
  border-color: var(--pink-neon);
  box-shadow: 0 0 30px rgba(247,37,133,0.7);
}

.upload-section {
  border-top: 2px solid rgba(255,255,255,0.1);
  padding-top: 25px;
  margin-top: 25px;
}

.upload-area {
  border: 3px dashed rgba(255,255,255,0.3);
  border-radius: 16px;
  padding: 40px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
}

.upload-area:hover {
  border-color: var(--purple-bright);
  background: rgba(255,255,255,0.05);
}

.upload-icon {
  font-size: 3em;
  margin-bottom: 15px;
}

.upload-text {
  font-size: 1.1em;
  opacity: 0.8;
}

.save-avatar-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, var(--purple-bright), var(--pink-neon));
  border: none;
  border-radius: 16px;
  color: var(--white);
  font-family: "Poppins", sans-serif;
  font-size: 1.1em;
  font-weight: 800;
  cursor: pointer;
  margin-top: 25px;
  transition: all 0.3s ease;
}

.save-avatar-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(247,37,133,0.6);
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  margin-bottom: 10px;
  font-weight: 600;
  font-size: 1.1em;
}

.form-input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 12px;
  padding: 15px 20px;
  color: var(--white);
  font-family: "Poppins", sans-serif;
  font-size: 1em;
  outline: none;
  transition: all 0.3s ease;
}

.form-input:focus {
  border-color: var(--blue-bright);
  box-shadow: 0 0 20px rgba(0,180,216,0.3);
}

@media (max-width: 768px) {
  .stats-grid {
    grid-template-columns: 1fr;
  }
  .friends-grid {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .profile-header {
    padding: 30px 20px;
  }
}
</style>
</head>

<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="container">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
    <a href="chat.html" class="back-button">← Back to Chat</a>
    <a href="settings.html" class="back-button" style="background: linear-gradient(135deg, var(--blue-bright), var(--purple-bright));">⚙️ Settings</a>
  </div>
  
  <!-- Profile Header -->
  <div class="profile-header">
    <div class="profile-avatar-container">
      <img src="" id="profileAvatar" class="profile-avatar" alt="Profile Avatar" style="display:none;">
      <div id="profileAvatarPlaceholder" class="profile-avatar" style="background: linear-gradient(135deg, var(--purple-bright), var(--pink-neon)); display: flex; align-items: center; justify-content: center; font-size: 4em;">👤</div>
      <button class="edit-avatar-btn" id="editAvatarBtn">✏️</button>
    </div>
    <h1 class="profile-username" id="profileUsername">Username</h1>
    <div class="profile-status">
      <span class="status-dot"></span>
      <span>Online</span>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon">⏱️</div>
      <div class="stat-value" id="timeSpent">0h 0m</div>
      <div class="stat-label">Time Spent</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">👥</div>
      <div class="stat-value" id="friendCount">0</div>
      <div class="stat-label">Friends</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">💬</div>
      <div class="stat-value" id="roomCount">4</div>
      <div class="stat-label">Chat Rooms</div>
    </div>
  </div>

  <!-- Friends Section -->
  <div class="section">
    <div class="section-header">
      <h2 class="section-title">👥 Friends</h2>
      <button class="add-btn" id="addFriendBtn">+ Add Friend</button>
    </div>
    <div class="friends-grid" id="friendsList">
      <div class="friend-card">
        <div class="friend-avatar" style="background: linear-gradient(135deg, var(--blue-bright), var(--pink-neon)); display: flex; align-items: center; justify-content: center; font-size: 2em;">👻</div>
        <div class="friend-name">No friends yet</div>
        <div class="friend-status">Add some friends!</div>
      </div>
    </div>
  </div>

  <!-- Chat Rooms Section -->
  <div class="section">
    <div class="section-header">
      <h2 class="section-title">💬 Your Chat Rooms</h2>
      <button class="add-btn" id="addRoomBtn">+ Create Room</button>
    </div>
    <div class="rooms-list" id="roomsList">
      <!-- Rooms will be loaded here -->
    </div>
  </div>
</div>

<!-- Avatar Selection Modal -->
<div class="modal" id="avatarModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Choose Avatar</h2>
      <button class="close-btn" id="closeAvatarModal">×</button>
    </div>
    
    <h3 style="margin-bottom: 15px; font-weight: 700;">Preset Avatars</h3>
    <div class="avatar-presets" id="avatarPresets"></div>
    
    <div class="upload-section">
      <h3 style="margin-bottom: 15px; font-weight: 700;">Upload Custom Avatar</h3>
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📁</div>
        <div class="upload-text">Click to upload or drag & drop</div>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
      </div>
    </div>
    
    <button class="save-avatar-btn" id="saveAvatarBtn">Save Avatar</button>
  </div>
</div>

<!-- Add Friend Modal -->
<div class="modal" id="addFriendModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Add Friend</h2>
      <button class="close-btn" id="closeFriendModal">×</button>
    </div>
    
    <div class="form-group">
      <label class="form-label">Friend's Username</label>
      <input type="text" class="form-input" id="friendUsername" placeholder="Enter username..." maxlength="20">
    </div>
    
    <button class="save-avatar-btn" id="saveFriendBtn">Add Friend</button>
  </div>
</div>

<!-- Create Room Modal -->
<div class="modal" id="createRoomModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Create Chat Room</h2>
      <button class="close-btn" id="closeRoomModal">×</button>
    </div>
    
    <div class="form-group">
      <label class="form-label">Room Name</label>
      <input type="text" class="form-input" id="roomName" placeholder="Enter room name..." maxlength="30">
    </div>
    
    <div class="form-group">
      <label class="form-label">Room Icon (Emoji)</label>
      <input type="text" class="form-input" id="roomIcon" placeholder="🎮" maxlength="2">
    </div>
    
    <div class="form-group">
      <label class="form-label">Privacy</label>
      <select class="form-input" id="roomPrivacy">
        <option value="public">Public - Anyone can join</option>
        <option value="private">Private - Invite only</option>
      </select>
    </div>
    
    <button class="save-avatar-btn" id="saveRoomBtn">Create Room</button>
  </div>
</div>

<script>
const PRESET_AVATARS = [
  { name: 'AuraBaby', url: 'https://i.ibb.co/Y4L448c/aurababy.jpg' },
  { name: 'King Darren', url: 'https://i.ibb.co/BH293xG/kingdarren.jpg' },
  { name: 'Daniel', url: 'https://i.ibb.co/RTwqxcc/daniel.jpg' },
  { name: 'Manuel', url: 'https://i.ibb.co/JRr6BWj/theonewhocknocks.jpg' },
  { name: 'Levi', url: 'https://i.ibb.co/vCCB5By/levi.png' },
  { name: 'Grant', url: 'https://i.ibb.co/TqHnrtS/grant.jpg' },
  { name: 'Zoely', url: 'https://i.ibb.co/fVLDq18/zoely.png' },
  { name: 'Lemmet', url: 'https://i.ibb.co/TBmZmYY/newlemmet.jpg' },
  { name: 'Kelly', url: 'https://i.ibb.co/Xk2DybZ/kelly.jpg' },
  { name: 'Bryce', url: 'https://i.ibb.co/pvgyknn/bryce.jpg' },
  { name: 'Fattie Baby', url: 'https://i.ibb.co/FkyMMCR/fattiebaby.jpg' },
  { name: 'Gooner Baby', url: 'https://i.ibb.co/b5DH8g2/goonerbaby.jpg' },
  { name: 'Teros', url: 'https://i.ibb.co/Nd6v0WjN/teros.jpg' },
  { name: 'Gangsta Baby', url: 'https://i.ibb.co/TM91vD3/Officalgangstababy.png' },
  { name: 'Dark Baby', url: 'https://i.ibb.co/vCTDWs4/output-1.jpg' },
  { name: 'Poor Baby', url: 'https://i.ibb.co/Nn9v6ZB/poorbaby.jpg' },
  { name: 'Rich Baby', url: 'https://i.ibb.co/DDSNbyp/richbaby.jpg' }
];

let currentUsername = '';
let viewingUsername = '';
let selectedAvatar = '';
let customAvatarData = '';
let sessionStartTime = Date.now();
let isOwnProfile = true;

// Initialize
async function init() {
  // Get URL parameters
  const urlParams = new URLSearchParams(window.location.search);
  const userParam = urlParams.get('user');
  
  try {
    const saved = await window.storage.get('aurababy_username');
    if (saved && saved.value) {
      currentUsername = saved.value;
      
      // Check if viewing another user's profile
      if (userParam && userParam !== currentUsername) {
        viewingUsername = userParam;
        isOwnProfile = false;
        document.getElementById('profileUsername').textContent = viewingUsername;
        
        // Hide edit buttons when viewing others
        document.getElementById('editAvatarBtn').style.display = 'none';
        document.getElementById('addFriendBtn').style.display = 'none';
        document.getElementById('addRoomBtn').style.display = 'none';
      } else {
        viewingUsername = currentUsername;
        isOwnProfile = true;
        document.getElementById('profileUsername').textContent = currentUsername;
      }
      
      loadProfile();
    } else {
      window.location.href = 'chat.html';
    }
  } catch (error) {
    console.error('Error loading profile:', error);
  }
  
  loadAvatarPresets();
  loadRooms();
  updateTimeSpent();
  setInterval(updateTimeSpent, 60000); // Update every minute
}

async function loadProfile() {
  try {
    // Load avatar
    const avatarData = await window.storage.get(`avatar_${viewingUsername}`);
    if (avatarData && avatarData.value) {
      setAvatar(avatarData.value);
    } else {
      document.getElementById('profileAvatarPlaceholder').textContent = viewingUsername.charAt(0).toUpperCase();
    }
    
    // Load friends
    const friendsData = await window.storage.get(`friends_${viewingUsername}`);
    if (friendsData && friendsData.value) {
      const friends = JSON.parse(friendsData.value);
      displayFriends(friends);
      document.getElementById('friendCount').textContent = friends.length;
    }
    
    // Load time spent (only for own profile)
    if (isOwnProfile) {
      const timeData = await window.storage.get(`time_${viewingUsername}`);
      if (timeData && timeData.value) {
        const totalMinutes = parseInt(timeData.value);
        updateTimeDisplay(totalMinutes);
      }
    } else {
      // Hide time for other profiles
      document.getElementById('timeSpent').textContent = 'N/A';
    }
  } catch (error) {
    console.error('Error loading profile:', error);
  }
}

function setAvatar(url) {
  const img = document.getElementById('profileAvatar');
  const placeholder = document.getElementById('profileAvatarPlaceholder');
  img.src = url;
  img.style.display = 'block';
  placeholder.style.display = 'none';
}

function loadAvatarPresets() {
  const container = document.getElementById('avatarPresets');
  container.innerHTML = '';
  
  PRESET_AVATARS.forEach(preset => {
    const img = document.createElement('img');
    img.src = preset.url;
    img.className = 'preset-avatar';
    img.alt = preset.name;
    img.onclick = () => selectPresetAvatar(preset.url, img);
    container.appendChild(img);
  });
}

function selectPresetAvatar(url, imgElement) {
  selectedAvatar = url;
  customAvatarData = '';
  document.querySelectorAll('.preset-avatar').forEach(img => img.classList.remove('selected'));
  imgElement.classList.add('selected');
}

async function loadRooms() {
  const defaultRooms = [
    { name: 'General', icon: '💬', privacy: 'public', members: 0 },
    { name: 'Gaming', icon: '🎮', privacy: 'public', members: 0 },
    { name: 'Music', icon: '🎵', privacy: 'public', members: 0 },
    { name: 'Random', icon: '✨', privacy: 'public', members: 0 }
  ];
  
  try {
    const roomsData = await window.storage.get(`rooms_${viewingUsername}`);
    const customRooms = roomsData && roomsData.value ? JSON.parse(roomsData.value) : [];
    const allRooms = [...defaultRooms, ...customRooms];
    
    displayRooms(allRooms);
    document.getElementById('roomCount').textContent = allRooms.length;
  } catch (error) {
    displayRooms(defaultRooms);
  }
}

function displayRooms(rooms) {
  const container = document.getElementById('roomsList');
  container.innerHTML = '';
  
  rooms.forEach((room, index) => {
    const roomCard = document.createElement('div');
    roomCard.className = 'room-card';
    roomCard.innerHTML = `
      <div class="room-icon">${room.icon}</div>
      <div class="room-info">
        <div class="room-name">${room.name}</div>
        <div class="room-members">${room.members} members</div>
      </div>
      <div class="room-privacy ${room.privacy}" ${isOwnProfile ? `onclick="toggleRoomPrivacy(${index})"` : ''}>${room.privacy.toUpperCase()}</div>
    `;
    container.appendChild(roomCard);
  });
}

function displayFriends(friends) {
  const container = document.getElementById('friendsList');
  container.innerHTML = '';
  
  if (friends.length === 0) {
    container.innerHTML = `
      <div class="friend-card">
        <div class="friend-avatar" style="background: linear-gradient(135deg, var(--blue-bright), var(--pink-neon)); display: flex; align-items: center; justify-content: center; font-size: 2em;">👻</div>
        <div class="friend-name">No friends yet</div>
        <div class="friend-status">Add some friends!</div>
      </div>
    `;
    return;
  }
  
  friends.forEach(friend => {
    const friendCard = document.createElement('div');
    friendCard.className = 'friend-card';
    const avatar = friend.avatar || `<div style="width: 70px; height: 70px; margin: 0 auto 12px; border-radius: 50%; background: linear-gradient(135deg, var(--blue-bright), var(--pink-neon)); display: flex; align-items: center; justify-content: center; font-size: 2em;">${friend.name.charAt(0).toUpperCase()}</div>`;
    
    friendCard.innerHTML = `
      ${friend.avatar ? `<img src="${friend.avatar}" class="friend-avatar" alt="${friend.name}">` : avatar}
      <div class="friend-name">${friend.name}</div>
      <div class="friend-status">Online</div>
    `;
    container.appendChild(friendCard);
  });
}

async function updateTimeSpent() {
  const currentTime = Date.now();
  const sessionMinutes = Math.floor((currentTime - sessionStartTime) / 60000);
  
  try {
    const timeData = await window.storage.get(`time_${currentUsername}`);
    const previousMinutes = timeData && timeData.value ? parseInt(timeData.value) : 0;
    const totalMinutes = previousMinutes + sessionMinutes;
    
    await window.storage.set(`time_${currentUsername}`, totalMinutes.toString());
    updateTimeDisplay(totalMinutes);
    
    sessionStartTime = currentTime;
  } catch (error) {
    console.error('Error updating time:', error);
  }
}

function updateTimeDisplay(totalMinutes) {
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  document.getElementById('timeSpent').textContent = `${hours}h ${minutes}m`;
}

// Modal controls
document.getElementById('editAvatarBtn').onclick = () => {
  document.getElementById('avatarModal').classList.add('active');
};

document.getElementById('closeAvatarModal').onclick = () => {
  document.getElementById('avatarModal').classList.remove('active');
};

document.getElementById('addFriendBtn').onclick = () => {
  document.getElementById('addFriendModal').classList.add('active');
};

document.getElementById('closeFriendModal').onclick = () => {
  document.getElementById('addFriendModal').classList.remove('active');
};

document.getElementById('addRoomBtn').onclick = () => {
  document.getElementById('createRoomModal').classList.add('active');
};

document.getElementById('closeRoomModal').onclick = () => {
  document.getElementById('createRoomModal').classList.remove('active');
};

// File upload
document.getElementById('uploadArea').onclick = () => {
  document.getElementById('fileInput').click();
};

document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (event) => {
      customAvatarData = event.target.result;
      selectedAvatar = '';
      document.querySelectorAll('.preset-avatar').forEach(img => img.classList.remove('selected'));
      document.getElementById('uploadArea').innerHTML = `
        <img src="${customAvatarData}" style="max-width: 100%; border-radius: 12px;">
        <div style="margin-top: 10px;">Custom image selected</div>
      `;
    };
    reader.readAsDataURL(file);
  }
};

// Save avatar
document.getElementById('saveAvatarBtn').onclick = async () => {
  const avatarUrl = customAvatarData || selectedAvatar;
  if (!avatarUrl) {
    alert('Please select an avatar!');
    return;
  }
  
  try {
    await window.storage.set(`avatar_${currentUsername}`, avatarUrl);
    setAvatar(avatarUrl);
    document.getElementById('avatarModal').classList.remove('active');
  } catch (error) {
    console.error('Error saving avatar:', error);
    alert('Failed to save avatar. Please try again.');
  }
};

// Add friend
document.getElementById('saveFriendBtn').onclick = async () => {
  const friendName = document.getElementById('friendUsername').value.trim();
  if (!friendName) {
    alert('Please enter a username!');
    return;
  }
  
  try {
    const friendsData = await window.storage.get(`friends_${currentUsername}`);
    const friends = friendsData && friendsData.value ? JSON.parse(friendsData.value) : [];
    
    if (friends.find(f => f.name === friendName)) {
      alert('Already friends!');
      return;
    }
    
    const avatarData = await window.storage.get(`avatar_${friendName}`);
    friends.push({
      name: friendName,
      avatar: avatarData && avatarData.value ? avatarData.value : null
    });
    
    await window.storage.set(`friends_${currentUsername}`, JSON.stringify(friends));
    displayFriends(friends);
    document.getElementById('friendCount').textContent = friends.length;
    document.getElementById('addFriendModal').classList.remove('active');
    document.getElementById('friendUsername').value = '';
  } catch (error) {
    console.error('Error adding friend:', error);
    alert('Failed to add friend. Please try again.');
  }
};

// Create room
document.getElementById('saveRoomBtn').onclick = async () => {
  const name = document.getElementById('roomName').value.trim();
  const icon = document.getElementById('roomIcon').value.trim() || '💬';
  const privacy = document.getElementById('roomPrivacy').value;
  
  if (!name) {
    alert('Please enter a room name!');
    return;
  }
  
  try {
    const roomsData = await window.storage.get(`rooms_${currentUsername}`);
    const rooms = roomsData && roomsData.value ? JSON.parse(roomsData.value) : [];
    
    rooms.push({ name, icon, privacy, members: 0 });
    await window.storage.set(`rooms_${currentUsername}`, JSON.stringify(rooms));
    
    loadRooms();
    document.getElementById('createRoomModal').classList.remove('active');
    document.getElementById('roomName').value = '';
    document.getElementById('roomIcon').value = '';
  } catch (error) {
    console.error('Error creating room:', error);
    alert('Failed to create room. Please try again.');
  }
};

async function toggleRoomPrivacy(index) {
  try {
    const roomsData = await window.storage.get(`rooms_${currentUsername}`);
    const rooms = roomsData && roomsData.value ? JSON.parse(roomsData.value) : [];
    
    if (rooms[index - 4]) { // Offset for default rooms
      rooms[index - 4].privacy = rooms[index - 4].privacy === 'public' ? 'private' : 'public';
      await window.storage.set(`rooms_${currentUsername}`, JSON.stringify(rooms));
      loadRooms();
    }
  } catch (error) {
    console.error('Error toggling privacy:', error);
  }
}

init();
</script>
