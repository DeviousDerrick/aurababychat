<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AuraBaby Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="chat_styles.css">
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>✨ AURABABY CHAT ✨</h1>
    <div id="loginForm">
      <input type="text" id="loginUsername" placeholder="Username" maxlength="20">
      <input type="password" id="loginCode" placeholder="6-Digit Code" maxlength="6">
      <button onclick="login()">LOGIN</button>
      <div class="login-toggle" onclick="toggleSignup()">Don't have an account? Sign up</div>
    </div>
    <div id="signupForm" style="display:none;">
      <input type="text" id="signupUsername" placeholder="Choose Username" maxlength="20">
      <input type="password" id="signupCode" placeholder="Create 6-Digit Code" maxlength="6">
      <input type="password" id="signupCodeConfirm" placeholder="Confirm Code" maxlength="6">
      <button onclick="signup()">SIGN UP</button>
      <div class="login-toggle" onclick="toggleSignup()">Already have an account? Login</div>
    </div>
  </div>
</div>

<div class="topbar">
  <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
  ✨ AURABABY CHAT ✨
</div>

<button class="top-btn settings-btn" onclick="openSettings()">⚙️</button>

<div class="container" id="mainApp" style="display:none;">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="section-title">ROOMS</div>
      <div class="room active" data-room="General 1">🌌 General 1</div>
      <div class="room" data-room="General 2">💫 General 2</div>
      <div class="room" data-room="General 3">⭐ General 3</div>
    </div>

    <div class="profile-section">
      <div class="profile-card">
        <div class="profile-avatar" id="myAvatar">?</div>
        <div class="profile-name" id="myUsername">Username</div>
      </div>
    </div>
  </div>

  <div class="chat">
    <div class="chat-header" id="roomName">🌌 General 1</div>
    <div class="messages" id="messages"></div>
    <div class="input">
      <div class="cooldown-timer" id="cooldownTimer" style="display:none;"></div>
      <div class="input-row">
        <input id="msgInput" placeholder="Type your message..." maxlength="200" />
        <button onclick="sendMessage()">SEND</button>
      </div>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsOverlay" onclick="closeSettings()"></div>
<div class="modal" id="settingsPanel">
  <button class="close-modal" onclick="closeSettings()">✕</button>
  <h2>Settings</h2>
  
  <div class="modal-section">
    <h3>Display</h3>
    <label><input type="checkbox" id="showTimestamps"> Show timestamps</label>
    <label><input type="checkbox" id="soundEnabled"> Sound notifications</label>
  </div>
  
  <div class="modal-section">
    <h3>Account</h3>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="app.js"></script>
</body>
</html>
