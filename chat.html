<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraBaby Chat</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body {
      margin: 0;
      height: 100vh;
      background: #0f1220;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .topbar {
      height: 60px;
      background: linear-gradient(90deg, #7b5cff, #5cc9ff);
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 22px;
      font-weight: bold;
    }

    /* Main layout */
    .container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: #161a33;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #222655;
    }

    .profile {
      padding: 16px;
      border-bottom: 1px solid #222655;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #5cc9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
    }

    .username {
      font-size: 14px;
      opacity: 0.9;
    }

    .rooms {
      padding: 10px;
      flex: 1;
    }

    .room {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 6px;
      background: transparent;
    }

    .room:hover {
      background: #232866;
    }

    .room.active {
      background: #5cc9ff;
      color: #000;
      font-weight: bold;
    }

    /* Chat area */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0f1220;
    }

    .chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid #222655;
      font-weight: bold;
      background: #13163a;
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 12px;
      opacity: 0.9;
    }

    .input-bar {
      display: flex;
      padding: 12px;
      border-top: 1px solid #222655;
      background: #13163a;
    }

    .input-bar input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #1b1f4d;
      color: #fff;
    }

    .input-bar button {
      margin-left: 10px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #5cc9ff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="topbar">AURABABY CHAT</div>

  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="profile">
        <div class="avatar">A</div>
        <div class="username">AuraUser</div>
      </div>
      <div class="rooms">
        <div class="room active" data-room="General 1">General 1</div>
        <div class="room" data-room="General 2">General 2</div>
        <div class="room" data-room="General 3">General 3</div>
      </div>
    </div>

    <!-- Chat -->
    <div class="chat">
      <div class="chat-header" id="chatHeader">General 1</div>
      <div class="messages" id="messages">
        <div class="message">Welcome to General 1 👋</div>
      </div>
      <div class="input-bar">
        <input type="text" placeholder="Type a message..." disabled />
        <button disabled>Send</button>
      </div>
    </div>
  </div>

  <script>
  // ===== BASIC KID-SAFE CHAT LOGIC =====
  let currentRoom = "General 1";
  let username = localStorage.getItem("aurababy_username") || prompt("Enter a username:") || "Guest";
  localStorage.setItem("aurababy_username", username);

  const messagesDiv = document.getElementById("messages");
  const input = document.querySelector(".input-bar input");
  const button = document.querySelector(".input-bar button");
  const header = document.getElementById("chatHeader");

  input.disabled = false;
  button.disabled = false;

  // Simple profanity filter
  const bannedWords = ["badword1", "badword2", "badword3"];
  function cleanText(text) {
    let cleaned = text;
    bannedWords.forEach(word => {
      const regex = new RegExp(word, "gi");
      cleaned = cleaned.replace(regex, "***");
    });
    return cleaned;
  }

  // Rate limiting (1 message per second)
  let lastMessageTime = 0;

  let unsubscribe = null;
  function loadRoom(room) {
    if (unsubscribe) unsubscribe();
    messagesDiv.innerHTML = "";

    unsubscribe = db
      .collection("rooms")
      .doc(room)
      .collection("messages")
      .orderBy("timestamp")
      .onSnapshot(snapshot => {
        messagesDiv.innerHTML = "";
        snapshot.forEach(doc => {
          const msg = doc.data();
          const div = document.createElement("div");
          div.className = "message";
          div.textContent = msg.user + ": " + msg.text;
          messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
  }

  loadRoom(currentRoom);

  button.onclick = () => {
    const now = Date.now();
    if (now - lastMessageTime < 1000) return;
    if (!input.value.trim()) return;

    lastMessageTime = now;

    db.collection("rooms")
      .doc(currentRoom)
      .collection("messages")
      .add({
        text: cleanText(input.value),
        user: username,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

    input.value = "";
  };

  document.querySelectorAll(".room").forEach(room => {
    room.onclick = () => {
      document.querySelectorAll(".room").forEach(r => r.classList.remove("active"));
      room.classList.add("active");

      currentRoom = room.dataset.room;
      header.textContent = currentRoom;
      loadRoom(currentRoom);
    };
  });
</script>
</body>
</html>
