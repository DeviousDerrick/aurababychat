<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AuraBaby Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { margin:0; background:#0f1220; color:#fff; font-family:Arial; }
.topbar { height:60px; background:#6a5cff; display:flex; align-items:center; padding:0 20px; font-weight:bold; }
.container { display:flex; height:calc(100vh - 60px); }
.sidebar { width:220px; background:#161a33; padding:10px; }
.room { padding:10px; cursor:pointer; border-radius:6px; }
.room.active { background:#6a5cff; }
.chat { flex:1; display:flex; flex-direction:column; }
.chat-header { padding:10px; background:#13163a; }
.messages { flex:1; padding:10px; overflow-y:auto; }
.message { margin-bottom:6px; }
.input { display:flex; padding:10px; background:#13163a; }
.input input { flex:1; padding:8px; }
</style>
</head>

<body>
<div class="topbar">AURABABY CHAT</div>

<div class="container">
  <div class="sidebar">
    <div class="room active" data-room="General 1">General 1</div>
    <div class="room" data-room="General 2">General 2</div>
    <div class="room" data-room="General 3">General 3</div>
  </div>

  <div class="chat">
    <div class="chat-header" id="roomName">General 1</div>
    <div class="messages" id="messages"></div>
    <div class="input">
      <input id="msgInput" placeholder="Type message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCYMK_j1QYx-OUdfXAv78PYMMy61C_rTHU",
  authDomain: "aurababychat.firebaseapp.com",
  projectId: "aurababychat",
  storageBucket: "aurababychat.firebasestorage.app",
  messagingSenderId: "302163119026",
  appId: "1:302163119026:web:3f9b15be86d318aac572ab"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let username = localStorage.getItem("name") || prompt("Username:");
localStorage.setItem("name", username);

let currentRoom = "General 1";
let unsub = null;

function loadRoom(room) {
  if (unsub) unsub();
  document.getElementById("messages").innerHTML = "";

  unsub = db.collection("rooms")
    .doc(room)
    .collection("messages")
    .orderBy("time")
    .onSnapshot(snap => {
      document.getElementById("messages").innerHTML = "";
      snap.forEach(doc => {
        const m = doc.data();
        const div = document.createElement("div");
        div.className = "message";
        div.textContent = m.user + ": " + m.text;
        document.getElementById("messages").appendChild(div);
      });
    });
}

loadRoom(currentRoom);

function sendMessage() {
  const input = document.getElementById("msgInput");
  if (!input.value) return;

  db.collection("rooms")
    .doc(currentRoom)
    .collection("messages")
    .add({
      user: username,
      text: input.value,
      time: firebase.firestore.FieldValue.serverTimestamp()
    });

  input.value = "";
}

document.querySelectorAll(".room").forEach(r => {
  r.onclick = () => {
    document.querySelectorAll(".room").forEach(x => x.classList.remove("active"));
    r.classList.add("active");
    currentRoom = r.dataset.room;
    document.getElementById("roomName").textContent = currentRoom;
    loadRoom(currentRoom);
  };
});
</script>
</body>
</html>
